<main>
    <section>
        <h2>Select Plot Source</h2>
        <form id="traceSelect">
            <label for="target">Target:</label>
            <span id="procsBadge" title="Live MPI rank count of the job selected as Target (from its job_mpi_ranks metric; follows malleable jobs, may include DMR launcher helper processes). For non-job targets (Node:/main) it falls back to the proxy-wide totals."
                style="display:inline-block; background:#1f8996; color:#fff; border-radius:4px;
                       padding:2px 8px; font-size:0.82em; margin-right:6px; vertical-align:middle;">
                MPI ranks: –
            </span>
            <select id="target" name="target" required>
                <!-- Options for selecting the target will be added dynamically using JavaScript -->
            </select>
            <button type="button" onclick="populateJobSelect()" title="Refresh job list">&#x21BB;</button>
            <input type="checkbox" id="autolatestbox" name="autolatestbox">
            <label for="autolatestbox">Auto latest</label>
            <br><br>

            <label for="metricSearch">Search metric:</label>
            <input type="text" id="metricSearch" placeholder="Type to filter…"
                style="padding:5px; border:1px solid #ddd; border-radius:5px; width:220px;">
            <br>
            <label for="metric">Metric:</label>
            <select id="metric" name="metric" required>
                <!-- Options for selecting the metric will be added dynamically using JavaScript -->
            </select><br><br>

            <label for="derivatebox">Derivate data:</label>
            <input type="checkbox" id="derivatebox" name="derivatebox">
            <span class="info-symbol" title="Show the rate of change (delta / time) of the metric.">&#x1F6C8</span>
            <br><br>

            <label for="holdbox">Hold (step):</label>
            <input type="checkbox" id="holdbox" name="holdbox" checked>
            <span class="info-symbol" title="Hold each value flat until the next sample instead of connecting dots with a line. Useful with Derivate to see per-interval bandwidth as a step chart.">&#x1F6C8</span>
            <br><br>

            <label for="timebox">Use relative time:</label>
            <span class="info-symbol"
                title="Swap from absolute system time to relative time since the start of the job.">&#x1F6C8</span>
            <input type="checkbox" id="timebox" name="timebox">
            <br><br>


        </form>
    </section>
    <section>
        <h2>FTIO</h2>
        <form id="ftioSelect">
            <label for="ftiobox">Predict phases with FTIO:</label>
            <span class="info-symbol"
                title="Display the dominant frequencies calculated by Ftio. Signal labels: 'Amplitude * Cos(2*PI * Frequency * Time + Phi) (Confidence %)'">&#x1F6C8</span>
            <input type="checkbox" id="ftiobox" name="ftiobox">
            <br><br>

            <!-- Container that will be shown only when ftio checkbox is checked -->
            <div id="ftioOptions" style="display: none;">
                <label for="ftioDropdown">Choose number of frequencies to display:</label>
                <select id="ftioDropdown" name="ftioDropdown">
                    <option value="1">1</option>
                </select>

                <div id="ftio-freq-warning" style="display:none; margin-top:8px; padding:6px 10px; border-radius:4px; font-size:0.9em;"></div>

                <br>

                <label for="ftioReconstruct">Reconstruct signal:</label>
                <span class="info-symbol"
                title="Reconstruct the original signal based on the extracted frequencies.">&#x1F6C8</span>
                <input type="checkbox" id="ftioReconstruct" name="ftioReconstruct">

                <br>

                <label for="ftiocustombox">Modify FTIO parameters:</label>
                <span class="info-symbol"
                title="Temporarily modify parameters sent to Ftio for a single metric.">&#x1F6C8</span>
                <input type="checkbox" id="ftiocustombox" name="ftiocustombox">
            </div>
            <br><br>

            <div id="ftio-container"
                style="display: none; background-color: var(--sidebar-bg); border-radius: 12px; padding: 20px">

                <div id="applyButtonGroup" class="ftio-params">
                    <label for="applyBtn">Apply Parameters: </label>
                    <input type="checkbox" id="applyBtn"></button>
                </div>
            </div>


        </form>
    </section>
    <section id="tracePlot">
        <h2>Visualizations</h2>

        <label for="size">Trace Size:</label>
        <progress id="size" value="0" max="100"> </progress>
        <span id="sizeText">0 MB / 32.00 MB (0%)</span>
        <br><br>

        <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap; margin-bottom:10px;">
            <label style="display:flex; align-items:center; gap:8px;">
                Width:
                <input type="range" id="chartWidthSlider" min="400" max="3000" value="900" step="50"
                    oninput="applyChartSize()" style="width:160px;">
                <span id="chartWidthVal" style="min-width:3.5em; text-align:right;">900</span> px
            </label>
            <label style="display:flex; align-items:center; gap:8px;">
                Height:
                <input type="range" id="chartHeightSlider" min="200" max="1600" value="600" step="50"
                    oninput="applyChartSize()" style="width:160px;">
                <span id="chartHeightVal" style="min-width:3.5em; text-align:right;">600</span> px
            </label>
        </div>

        <div style="font-size:0.78em; color:#888; margin-bottom:4px;">
            Shift+scroll: zoom X &nbsp;|&nbsp; Ctrl+drag: select time range &nbsp;|&nbsp;
            Right-drag: zoom Y &nbsp;|&nbsp; Drag: pan &nbsp;|&nbsp; Dbl-click: reset
        </div>
        <div id="chartContainer" style="position:relative; width:900px; height:600px;">
            <div id="zoomBox" style="display:none; position:absolute; top:0; bottom:0;
                border:2px solid #1f8996; background:rgba(31,137,150,0.12);
                pointer-events:none; z-index:10;"></div>
            <canvas id="myChart"></canvas>
        </div>
    </section>

    <script src="/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="/ftioTemplate.js"></script>

    <script>

        // ==================
        // Functions
        // ==================

        // Function to populate the Metric select element based on the selected Target
        // Full list of all metric names for the current job (used by search filter)
        let allMetrics = [];

        function applyMetricFilter() {
            const query = document.getElementById('metricSearch').value.toLowerCase();
            const metricSelect = document.getElementById('metric');
            const prevVal = metricSelect.value;
            metricSelect.innerHTML = '';
            const filtered = query ? allMetrics.filter(m => m.toLowerCase().includes(query)) : allMetrics;
            for (const v of filtered) {
                const option = document.createElement('option');
                option.value = v;
                option.text = v;
                metricSelect.appendChild(option);
            }
            // Restore selection if still present
            if (filtered.includes(prevVal)) {
                metricSelect.value = prevVal;
            }
        }

        async function populateMetricSelect() {
            const targetSelect = document.getElementById('target');
            const metricSelect = document.getElementById('metric');
            const selectedTarget = targetSelect.value;
            const prevMetric = metricSelect.value;

            // Do NOT clear the select here — wait until new data arrives so
            // the dropdown never flashes empty while the fetch is in-flight.

            try {
                const response = await fetch("/trace/metrics?job=" + selectedTarget);
                if (response.ok) {
                    const data = await response.json();
                    data.sort((a, b) => a.localeCompare(b));
                    // Only rebuild the dropdown if the metric list actually changed,
                    // so an open dropdown is never closed under the user's mouse.
                    const changed = data.length !== allMetrics.length ||
                        data.some((v, i) => v !== allMetrics[i]);
                    allMetrics = data;
                    if (changed) {
                        applyMetricFilter();
                        // Restore previously selected metric if available in new job
                        if (prevMetric && data.includes(prevMetric)) {
                            metricSelect.value = prevMetric;
                        }
                    }
                    // Immediately update chart — don't wait for the polling timer
                    if (typeof chart !== 'undefined' && metricSelect.value) {
                        update_data(chart);
                    }
                } else {
                    console.error(`Failed to fetch metrics for job ${selectedTarget}`);
                }
            } catch (error) {
                console.error(error);
            }
        }


        // Signature of the last job list we rendered, to skip needless DOM rebuilds
        let lastJobListKey = null;

        async function populateJobSelect() {
            const comboBox = document.getElementById('target');
            const prevJob = comboBox.value;

            fetch('/trace/list')
                .then(response => response.json())
                .then(data => {
                    if (!data.length) return;
                    const autoLatest = document.getElementById('autolatestbox').checked;

                    data.sort((a, b) => b.desc.start_time - a.desc.start_time);

                    // Rebuild the <option> list only when it actually changed, so an
                    // open dropdown is not closed under the user's mouse.
                    const key = data.map(i => i.desc.jobid).join('|');
                    if (key !== lastJobListKey) {
                        lastJobListKey = key;
                        comboBox.innerHTML = "";
                        data.forEach(item => {
                            const option = document.createElement('option');
                            option.value = item.desc.jobid;
                            option.textContent = item.desc.jobid + " : " + item.desc.command;
                            comboBox.appendChild(option);
                        });
                    }

                    if (autoLatest) {
                        // data is sorted newest-first
                        comboBox.value = data[0].desc.jobid;
                    } else {
                        // Restore previously selected job if still available, else first
                        comboBox.value = prevJob && [...comboBox.options].some(o => o.value === prevJob)
                            ? prevJob : comboBox.options[0].value;
                    }

                    // Always refresh the metric list: for a freshly started job the
                    // first /trace/metrics fetch often returns an empty list (the
                    // trace has no counters yet), so we must keep re-fetching.
                    // populateMetricSelect only touches the DOM when the list
                    // changed and triggers a chart update itself.
                    populateMetricSelect();
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        async function loadFTIOForm() {
            fetch('ftioTemplate.html')
                .then(response => {
                    return response.text()
                })
                .then(html => {
                    const parser = new DOMParser()

                    const doc = parser.parseFromString(html, "text/html")

                    const snippet = doc.getElementById('ftioParameters');
                    document.getElementById('ftio-container').prepend(snippet.cloneNode(true));

                    // After injecting HTML, initialize JS logic
                    initFTIOTemplate('/ftio/modified_args');
                })
                .catch(error => {
                    console.error('Failed to fetch page: ', error)
                })

        }

        function update_data(chart) {

            const target = document.getElementById('target').value;
            const metric = document.getElementById('metric').value;
            if (!metric) return;
            const derivate = document.getElementById('derivatebox').checked;
            const holdMode = document.getElementById('holdbox').checked;
            const relativeTime = document.getElementById('timebox').checked;

            const request = {
                jobid: target,
                filter: metric,
                derivate: derivate
            };

            // Send the request using fetch
            fetch('/trace/plot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(request)
            }).then(response => response.json())
                .then(data => {
                    console.log(data);

                    let labels = [];
                    let datapoint = [];
                    xScale = chart.options.scales.x;

                    chart._startTimeStamp = data[0][0] * 1000;
                    chart._endTimeStamp = data[data.length - 1][0] * 1000;
                    chart._duration = chart._endTimeStamp - chart._startTimeStamp;

                    const currentXMin = xScale.min;
                    const currentXMax = xScale.max;

                    chart.data.datasets[0].label = metric;
                    chart.options.scales.y.title.text = metric;

                    // Calculate time format
                    if (relativeTime){
                        xScale.ticks.callback = (value) => {
                            // after hour passed, zoom in removes hour display which causes it to show only minutes which is not accurate even if it should be 1 hour and 59 minutes
                            const totalDurationInHours = chart._duration / (3600000);
                            const totalMilliseconds = value - chart._startTimeStamp;
                            const totalSeconds = Math.floor(totalMilliseconds / 1000);
                            const hours = Math.floor(totalSeconds / 3600);
                            const minutes = Math.floor((totalSeconds % 3600) / 60);
                            const seconds = totalSeconds % 60; 
                            const milliseconds = totalMilliseconds % 1000;
                            let finalString = '';
                            if (totalDurationInHours >= 1) {
                                finalString += hours.toString().padStart(2, '0') + ':';
                            }
                            finalString += minutes.toString().padStart(2, '0') + ':';
                            finalString += seconds.toString().padStart(2, '0');
                            if (totalDurationInHours < 1) {
                                finalString += '.' + milliseconds.toString().substring(0, 1);
                            }

                            return finalString;
                        };
                    }
                    else {
                        delete xScale.ticks.callback;
                    }

                    xScale.title.text = relativeTime ? 'Time' : 'System Time';
                    
                    const points = data.map(v => ({ x: v[0] * 1000, y: v[1] }));
                    /* 'before' in Chart.js holds the LEFT point's value forward until the
                       next sample (sample-and-hold) — matches the interval-start anchoring
                       of dewrap and derivated series ('after' would hold the new value
                       backward, showing each interval one bin early) */
                    chart.data.datasets[0].stepped = holdMode ? 'before' : false;
                    chart.data.datasets[0].data = points;
                    chart.update();

                    xScale.min = currentXMin;
                    xScale.max = currentXMax;
                })
                .catch(error => {
                    console.error('Error:', error);
                });

            const request_size = {
                jobid: target
            };

            let query_params = new URLSearchParams(request_size).toString();

            fetch(`/trace/size?${query_params}`, {
                method: 'GET',
            }).then(response => response.json())
                .then(data => {
                    const sizeElement = document.getElementById('size');
                    const sizeText = document.getElementById('sizeText');

                    const sizeMB = data[0] / (1024 * 1024);
                    const maxSizeMB = data[1] / (1024 * 1024);

                    sizeElement.value = sizeMB;
                    sizeElement.max = maxSizeMB;

                    sizeText.textContent = `${sizeMB.toFixed(2)} MB / ${maxSizeMB.toFixed(2)} MB  (${((sizeMB / maxSizeMB) * 100).toFixed(1)}%)`;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }


        function update_ftio() {
            const target = document.getElementById('target').value;
            const metric = document.getElementById('metric').value;
            const derivate = document.getElementById('derivatebox').checked;

            // Create the JSON request object
            let request_ftio = {
                jobid: target,
                metricid: metric
            }
            if (derivate) request_ftio.derivate = "deriv__"
            if (applyCustomFTIO) request_ftio.args = JSON.stringify(convertParameters());

            let query_params = new URLSearchParams(request_ftio).toString();

            const server_url = applyCustomFTIO ? '/ftio/modified_args' : '/trace/ftio';

            fetch(`${server_url}?${query_params}`, {
                method: 'GET',
            }).then(response => response.json())
                .then(data => {
                    if (data.amp === undefined) {
                        console.warn(data.operation);
                        setFtioWarning('No dominant frequency — FTIO returned no result for this metric.', 'error');
                        chart._ftioParams = null;
                        return;
                    }
                    console.log(data);

                    const topFreqs = data.top_freqs;
                    if (!topFreqs || !topFreqs.freq || !topFreqs.conf ||
                        topFreqs.freq.length === 0 || topFreqs.conf.length === 0) {
                        setFtioWarning('No dominant frequency — no periodic pattern detected in this metric.', 'error');
                        chart._ftioParams = null;
                        return;
                    }

                    const nDomFreq = data.dominant_freq ? data.dominant_freq.length : 0;
                    if (nDomFreq === 0) {
                        setFtioWarning(
                            'No dominant frequency — showing candidate frequencies as dashed lines (low confidence).',
                            'warn'
                        );
                    } else {
                        setFtioWarning(null);
                    }

                    // Expand/Retract select menu
                    const targetLength = Math.min(topFreqs.freq.length, topFreqs.conf.length, 10);
                    while (ftioDropdown.options.length !== targetLength) {
                        if (ftioDropdown.options.length < targetLength) {
                            const newIndex = ftioDropdown.options.length + 1;
                            const opt = document.createElement('option');
                            opt.value = newIndex;
                            opt.text = newIndex;
                            ftioDropdown.appendChild(opt);
                        } else {
                            ftioDropdown.removeChild(ftioDropdown.lastChild);
                        }
                    }

                    // Get and Sort data by confidence
                    const indices = topFreqs.conf.map((_, i) => i);
                    indices.sort((a, b) => topFreqs.conf[b] - topFreqs.conf[a]);
                    const sortedFreqs = indices.map(i => topFreqs.freq[i]);
                    const sortedAmps = indices.map(i => topFreqs.amp[i]);
                    const sortedConfs = indices.map(i => topFreqs.conf[i]);
                    const sortedPhis = indices.map(i => topFreqs.phi[i]);
                    const sortedNames = indices.map(i => {
                        const f = topFreqs.freq[i], a = topFreqs.amp[i], p = topFreqs.phi[i];
                        return `${a.toExponential(2)}*cos(2π*${f.toExponential(2)}*t${p >= 0 ? '+' : '-'}${Math.abs(p).toExponential(2)})`;
                    });

                    // Update dataset labels
                    chart.data.datasets.forEach((ds, i) => {
                        if (i === 0) return;
                        const conf = (sortedConfs[i - 1] * 100).toFixed(1);
                        ds.label = sortedNames[i - 1] + ` (${conf}%)`;
                    });


                    // Calculate the mean value for the data
                    const yValues = chart.data.datasets[0].data.map(point => point.y);
                    const meanValue = yValues.reduce((sum, value) => sum + value, 0) / yValues.length;

                    chart._ftioParams = {
                        sortedFreqs: sortedFreqs,
                        sortedAmps: sortedAmps,
                        sortedConfs: sortedConfs,
                        sortedPhis: sortedPhis,
                        sortedNames: sortedNames,
                        n_samples: data.n_samples,
                        freq: data.freq,
                        n_dom_freq: nDomFreq,
                        meanValue: meanValue
                    };

                    chart.update();

                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        const ftioResult = {
            id: 'ftioResult',
            afterDraw: (chart) => {
                if (!showFTIO) return;
                if (!chart._endTimeStamp || !chart._startTimeStamp) return;
                if (!chart._ftioParams) return;

                const { ctx, chartArea: { left, right, top, bottom }, scales } = chart;
                const { sortedFreqs, sortedAmps, sortedConfs, sortedPhis, sortedNames, n_samples, freq, n_dom_freq, meanValue } = chart._ftioParams;

                showFTIO = ftiobox.checked ? parseInt(ftioDropdown.value) : 0;
                const reconstruct = document.getElementById('ftioReconstruct').checked;

                //Invariants
                const yZero = scales.y.getPixelForValue(0);
                const yOffset = scales.y.getPixelForValue(meanValue);
                const beginning = scales.x.min ?? chart._startTimeStamp;
                const end = scales.x.max ?? chart._endTimeStamp;
                const totalDuration = (end - beginning) / 1000;
                const pixelWidth = right - left;
                const panInSeconds = scales.x.min ? (scales.x.min - chart._startTimeStamp) / 1000 : 0;

                const labelPadding = 8;

                chart._ftioHidden = chart._ftioHidden || {};

                const reconstruction = new Array(Math.floor(right - left + 1)).fill(0);

                ctx.save();
                // Clip the ftio output to avoid drawing over the labels
                ctx.beginPath();
                ctx.rect(left, top, right - left, bottom - top + labelPadding);
                ctx.clip();

                for (let i = 0; i < sortedFreqs.length; i++) {
                    if (i >= showFTIO && !reconstruct) break;

                    const frequency = sortedFreqs[i];
                    const amplitude = sortedAmps[i];
                    const phi = sortedPhis[i];

                    let amp = amplitude * (1 / n_samples);
                    if (frequency !== 0 && !(frequency === freq / 2)) {
                        amp = amplitude * (2 / n_samples);
                    }

                    const yAmp = scales.y.getPixelForValue(amp);
                    const amplitudePixels = Math.abs(yAmp - yZero); // Calculate the pixel height for the amplitude

                    // Draw the FTIO result
                    ctx.beginPath();

                    // Precompute invariables for performance
                    const invariables = 2 * Math.PI * frequency * totalDuration;
                    const phiOffset = phi + 2 * Math.PI * frequency * (chart._startTimeStamp / 1000 + panInSeconds);

                    for (let x = left; x <= right; x += 1) {
                        // Get progress as percentage
                        const progress = (x - left) / pixelWidth;

                        const y = yOffset + amplitudePixels * Math.cos(invariables * progress + phiOffset);

                        if (reconstruct) reconstruction[Math.round(x - left)] += y - yOffset;

                        if (i >= showFTIO || chart._ftioHidden[i]) continue;
                        if (x === left) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }

                    ctx.strokeStyle = ftioColors[i];
                    n_dom_freq > i ? ctx.setLineDash([]) : ctx.setLineDash([10, 2]); // Solid line for dominant frequencies, dashed for non-dominant
                    ctx.stroke();
                }

                // Update dataset labels
                chart.data.datasets.forEach((ds, i) => {
                    if (i === 0) return;
                    const conf = (sortedConfs[i - 1] * 100).toFixed(1);
                    ds.label = `${sortedNames[i - 1]}` + ` (${conf}%)`;
                });

                if (!reconstruct) {
                    ctx.restore();
                    return;
                }

                // Draw reconstructed signal if enabled
                ctx.beginPath();
                for (let x = left; x <= right; x += 1) {
                    const y = reconstruction[Math.round(x - left)] + yOffset;
                    if (x === left) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                ctx.strokeStyle = '#3B3B3B';
                ctx.setLineDash([]);
                ctx.stroke();
                ctx.restore();
            }
        };

        function updateFtioVisibility() {
            showFTIO = ftiobox.checked ? parseInt(ftioDropdown.value) : 0;
            // Keep the base data set and all ftio datasets smaller than showFTIO
            chart.data.datasets = chart.data.datasets.slice(0, 1 + showFTIO);
            chart._ftioHidden = chart._ftioHidden || {};

            if (showFTIO > 0) {
                ftioOptions.style.display = 'block';
                // Add missing datasets
                for (let i = chart.data.datasets.length - 1; i < showFTIO; i++) {
                    chart.data.datasets.push({
                        label: 'FTIO' + (i + 1),
                        data: [],
                        borderWidth: 1,
                        borderColor: ftioColors[i],
                        backgroundColor: ftioColors[i],
                    });
                    chart._ftioHidden[i] = false;
                }
                update_ftio();
            } else {
                ftioOptions.style.display = 'none';
                ftioSettings.style.display = 'none';
                ftiocustombox.checked = false;
                setFtioWarning(null);
                applyBtn.checked = false;
                applyCustomFTIO = false;
                chart._ftioHidden = {};
            }
            chart.update();
        }

        function setFtioWarning(msg, type) {
            const el = document.getElementById('ftio-freq-warning');
            if (!msg) { el.style.display = 'none'; return; }
            el.textContent = msg;
            el.style.display = '';
            if (type === 'error') {
                el.style.cssText += '; background:#fff0f0; color:#cc0000; border:1px solid #ffcccc;';
            } else {
                el.style.cssText += '; background:#fff8e1; color:#7a5c00; border:1px solid #ffe082;';
            }
        }

        function applyChartSize() {
            var w = parseInt(document.getElementById('chartWidthSlider').value, 10);
            var h = parseInt(document.getElementById('chartHeightSlider').value, 10);
            document.getElementById('chartWidthVal').textContent = w;
            document.getElementById('chartHeightVal').textContent = h;
            var container = document.getElementById('chartContainer');
            container.style.width = w + 'px';
            container.style.height = h + 'px';
            if (typeof chart !== 'undefined') chart.resize();
        }

        function initChartSize() {
            var defaultW = Math.round(window.innerWidth * 0.8);
            defaultW = Math.max(400, Math.min(defaultW, 3000));
            var slider = document.getElementById('chartWidthSlider');
            slider.value = defaultW;
            document.getElementById('chartWidthVal').textContent = defaultW;
            var container = document.getElementById('chartContainer');
            container.style.width = defaultW + 'px';
        }

        // ==================
        // Initialization
        // ==================

        // Set chart width to 80% of the page by default
        initChartSize();

        // Initialize the Metric select options based on the default Target
        populateJobSelect();

        // Live badge — MPI rank count of the SELECTED job (its job_mpi_ranks
        // counter from /job, cheap), refreshed every 3 s. Non-job targets
        // (Node:/main) fall back to the proxy-wide /ranks | /procs totals.
        function refreshProcsBadge() {
            const badge = document.getElementById('procsBadge');
            const target = document.getElementById('target').value;
            const isJob = target && !target.startsWith('Node:') && target !== 'main';
            if (isJob) {
                fetch('/job').then(r => r.json()).then(profiles => {
                    const p = profiles.find(p => p.desc && p.desc.jobid === target);
                    const c = p && p.counters.find(c => c.name === 'job_mpi_ranks');
                    const v = c && c.ctype && c.ctype.Counter ? c.ctype.Counter.value : null;
                    if (v !== null) {
                        badge.textContent = 'MPI ranks: ' + v;
                        badge.style.background = v > 0 ? '#1f8996' : '#888';
                    } else {
                        /* job no longer live: show the last traced value */
                        fetch('/trace/plot?jobid=' + encodeURIComponent(target) + '&filter=job_mpi_ranks')
                            .then(r => r.json()).then(pts => {
                                const last = Array.isArray(pts) && pts.length ? pts[pts.length - 1][1] : '–';
                                badge.textContent = 'MPI ranks: ' + last + ' (ended)';
                                badge.style.background = '#888';
                            }).catch(() => { badge.textContent = 'MPI ranks: –'; });
                    }
                }).catch(() => { badge.textContent = 'MPI ranks: –'; });
            } else {
                Promise.all([
                    fetch('/ranks').then(r => r.json()).catch(() => '–'),
                    fetch('/procs').then(r => r.json()).catch(() => '–')
                ]).then(([ranks, procs]) => {
                    badge.textContent = 'proxy-wide ranks: ' + ranks + ' | procs: ' + procs;
                    badge.style.background = (ranks > 0 || procs > 0) ? '#1f8996' : '#888';
                }).catch(() => {});
            }
        }
        refreshProcsBadge();
        setInterval(refreshProcsBadge, 3000);
        document.getElementById('target').addEventListener('change', refreshProcsBadge);

        // Auto-latest: refresh job list and re-select latest every 5 s — ON by default
        let autoLatestTimer = null;
        document.getElementById('autolatestbox').checked = true;
        autoLatestTimer = setInterval(populateJobSelect, 5000);

        document.getElementById('autolatestbox').addEventListener('change', function () {
            if (this.checked) {
                populateJobSelect();
                autoLatestTimer = setInterval(populateJobSelect, 5000);
            } else {
                clearInterval(autoLatestTimer);
                autoLatestTimer = null;
            }
        });

        loadFTIOForm();

        const target = document.getElementById('target').value;
        const metric = document.getElementById('metric').value;

        const ftiobox = document.getElementById('ftiobox');
        const ftioOptions = document.getElementById('ftioOptions');
        ftioOptions.style.display = ftiobox.checked ? "block" : "none";
        const ftiocustombox = document.getElementById('ftiocustombox');
        const ftioSettings = document.getElementById('ftio-container');
        ftioSettings.style.display = ftiocustombox.checked ? "block" : "none";
        const ftioDropdown = document.getElementById('ftioDropdown');
        let showFTIO = ftiobox.checked ? ftioDropdown.value : 0;

        let applyCustomFTIO = false;
        const applyBtn = document.getElementById('applyBtn');
        applyBtn.checked = false;

        // Create the JSON request object
        const request = {
            jobid: target,
            filter: metric,
        };

        const ftioColors = ['#C93E3E', '#9AC932', '#8C3FBF', '#56C3D6', '#D46C22', '#999999', '#4E5691', '#11AD19', '#751410', '#E31B9A'];

        const ctx = document.getElementById('myChart');

        const _darkMode = document.body.classList.contains('dark');
        if (_darkMode) {
            Chart.defaults.color = '#e0e0e0';
            Chart.defaults.borderColor = 'rgba(255,255,255,0.15)';
        }

        let labels = [];
        let datapoint = [];

        let chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: metric,
                    data: datapoint,
                    borderWidth: 1,
                    borderColor: '#73B7F3',
                    backgroundColor: '#73B7F3',
                }],
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        left: 35,
                        right: 70,
                        top: 10,
                        bottom: 10
                    }
                },
                animation: {
                    duration: 500
                },
                scales: {
                    x: {
                        type: 'time',
                        title: {
                            display: true,
                            text: 'Time',
                            font: {
                                size: 14
                            },
                            padding: 20
                        },
                        time: {
                            // Customize label display format here:
                            tooltipFormat: 'd/M/yy HH:mm:ss.SSS',
                            displayFormats: {
                                millisecond: 'd/M/yy HH:mm:ss',
                                second: 'd/M/yy HH:mm:ss',
                            }
                        },
                        ticks: {
                            source: 'data',
                            autoSkip: true,
                            maxRotation: 65,
                            minRotation: 15
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: metric,
                            font: {
                                size: 14
                            },
                            padding: 20
                        },
                        beginAtZero: true
                    }
                },
                plugins: {
                    legend: {
                        labels: {
                            padding: 20
                        },
                        onClick: function (event, legendItem, legend) {
                            const chart = legend.chart;
                            const index = legendItem.datasetIndex;

                            // Prevent hiding the first dataset (base signal)
                            if (index === 0) return;

                            if (chart.isDatasetVisible(index)) {
                                chart.hide(index);
                                legendItem.hidden = true;
                            } else {
                                chart.show(index);
                                legendItem.hidden = false;
                            }

                            chart._ftioHidden = chart._ftioHidden || {};
                            chart._ftioHidden[index - 1] = legendItem.hidden;

                            chart.update();
                        }
                    }
                }
            },
            plugins: [ftioResult]
        });

        updateFtioVisibility();

        setInterval(function () {
            const metric = document.getElementById('metric').value;
            if (metric) update_data(chart);
        }, 3000);

        setInterval(function () {
            if (showFTIO) {
                update_ftio();
            }
        }, 5000);

        // ==================
        // Event Listeners
        // ==================

        // Event listener to populate the Metric select element when the Target changes
        document.getElementById('target').addEventListener('change', populateMetricSelect);

        document.getElementById('metricSearch').addEventListener('input', function () {
            applyMetricFilter();
            update_data(chart);
        });
        document.getElementById('derivatebox').addEventListener('change', function () { update_data(chart); });
        document.getElementById('holdbox').addEventListener('change', function () { update_data(chart); });

        // Event listener to update ftio data when the Metric changes
        document.getElementById('metric').addEventListener('change', function () {
            update_data(chart);
            if (showFTIO) {
                update_ftio();
            }
        });

        ftioDropdown.addEventListener('change', updateFtioVisibility);
        ftiobox.addEventListener('change', updateFtioVisibility);
        document.getElementById('ftioReconstruct').addEventListener('change', function () {
            chart.update();
        });
        ftiocustombox.addEventListener('change', function () {
            const ftioSettings = document.getElementById('ftio-container');
            if (ftiocustombox.checked) {
                applyBtn.checked = true;
                applyCustomFTIO = true;
            } else {
                applyBtn.checked = false;
                applyCustomFTIO = false;
            }
            ftioSettings.style.display = ftiocustombox.checked ? "block" : "none";
        });
        applyBtn.addEventListener('change', function () {
            applyCustomFTIO = applyBtn.checked;
            console.log(`Apply Custom FTIO Parameters: ${applyCustomFTIO}`);
        });

        // Event listener to handle zooming with mouse wheel + shift key
        ctx.addEventListener('wheel', function (event) {
            if (!event.shiftKey) return;
            event.preventDefault(); // Prevent page scrolling

            const xScale = chart.scales.x;

            // Convert mouse position on x axis to chart value
            const xMouseValue = xScale.getValueForPixel(event.offsetX);

            // Current scale range
            const range = xScale.max - xScale.min;

            // Calculate new range based on wheel direction
            let newRange;

            if (event.deltaY < 0) {
                // Zoom in
                newRange = range * 0.7;
            } else {
                // Zoom out
                newRange = range * 1.5;
            }

            // Calculate new min and max so that xValue stays under the mouse pointer
            let newMin = xMouseValue - ((xMouseValue - xScale.min) / range) * newRange;
            let newMax = xMouseValue + ((xScale.max - xMouseValue) / range) * newRange;

            if (newMin <= chart._startTimeStamp) {
                newMin = undefined;
            }
            if (newMax >= chart._endTimeStamp) {
                newMax = undefined
            }

            // Set new scale limits
            chart.options.scales.x.min = newMin;
            chart.options.scales.x.max = newMax;

            chart.update();
        });

        // Variables for panning
        let isPanning = false;
        let startX = null;
        let startMin = null;
        let startMax = null;

        let lastUpdate = 0;
        const updateInterval = 16.67;

        // Event listeners to handle panning with mouse drag
        // Ctrl+drag = x-axis box-select zoom
        let isBoxZooming = false;
        let boxStartX = null;
        const zoomBox = document.getElementById('zoomBox');

        ctx.addEventListener('mousedown', (event) => {
            if (event.button !== 0) return;
            chart.options.animation.duration = 0;
            if (event.ctrlKey) {
                isBoxZooming = true;
                boxStartX = event.offsetX;
                const xScale = chart.scales.x;
                zoomBox.style.left = (event.offsetX - (xScale.left - ctx.offsetLeft || 0)) + 'px';
                zoomBox.style.left = event.offsetX + 'px';
                zoomBox.style.width = '0px';
                zoomBox.style.display = 'block';
            } else {
                isPanning = true;
                startX = event.offsetX;
                startMin = chart.scales.x.min;
                startMax = chart.scales.x.max;
            }
        });

        ctx.addEventListener('mousemove', (event) => {
            if (Date.now() - lastUpdate < updateInterval) return;
            lastUpdate = Date.now();

            if (isBoxZooming) {
                const left = Math.min(boxStartX, event.offsetX);
                const width = Math.abs(event.offsetX - boxStartX);
                zoomBox.style.left = left + 'px';
                zoomBox.style.width = width + 'px';
                return;
            }

            if (!isPanning) return;

            const xScale = chart.scales.x;
            const pixelsPerUnit = (xScale.right - xScale.left) / (startMax - startMin);
            const deltaXUnits = (startX - event.offsetX) / pixelsPerUnit;

            if (startMin + deltaXUnits <= chart._startTimeStamp) {
                chart.options.scales.x.min = undefined;
                return;
            }
            else if (startMax + deltaXUnits >= chart._endTimeStamp) {
                chart.options.scales.x.max = undefined;
                return;
            }

            chart.options.scales.x.min = startMin + deltaXUnits;
            chart.options.scales.x.max = startMax + deltaXUnits;
            chart.update('none');
        });

        ctx.addEventListener('mouseup', (event) => {
            chart.options.animation.duration = 500;
            if (isBoxZooming) {
                isBoxZooming = false;
                zoomBox.style.display = 'none';
                const x1 = Math.min(boxStartX, event.offsetX);
                const x2 = Math.max(boxStartX, event.offsetX);
                if (x2 - x1 > 5) {
                    const xScale = chart.scales.x;
                    chart.options.scales.x.min = xScale.getValueForPixel(x1);
                    chart.options.scales.x.max = xScale.getValueForPixel(x2);
                    chart.update();
                }
            }
            isPanning = false;
        });

        ctx.addEventListener('mouseleave', () => {
            chart.options.animation.duration = 500;
            isPanning = false;
            isYZooming = false;
            if (isBoxZooming) {
                isBoxZooming = false;
                zoomBox.style.display = 'none';
            }
        });

        // Right-click + vertical drag = y-axis zoom
        // Drag up → zoom in (shrink y range), drag down → zoom out (expand y range)
        let isYZooming = false;
        let yZoomStartY = null;
        let yZoomStartMin = null;
        let yZoomStartMax = null;

        ctx.addEventListener('contextmenu', (event) => {
            event.preventDefault(); // suppress browser context menu during y-zoom
        });

        ctx.addEventListener('mousedown', (event) => {
            if (event.button !== 2) return; // right button only
            event.preventDefault();
            isYZooming = true;
            yZoomStartY = event.offsetY;
            const yScale = chart.scales.y;
            yZoomStartMin = yScale.min;
            yZoomStartMax = yScale.max;
        });

        ctx.addEventListener('mousemove', (event) => {
            if (!isYZooming) return;
            if (Date.now() - lastUpdate < updateInterval) return;
            lastUpdate = Date.now();

            const deltaY = yZoomStartY - event.offsetY; // positive = drag up = zoom in
            const yScale = chart.scales.y;
            const range = yZoomStartMax - yZoomStartMin;
            const factor = Math.pow(0.997, deltaY); // smooth zoom factor
            const center = (yZoomStartMin + yZoomStartMax) / 2;
            const halfRange = (range * factor) / 2;

            chart.options.scales.y.min = center - halfRange;
            chart.options.scales.y.max = center + halfRange;
            chart.update('none');
        });

        ctx.addEventListener('mouseup', (event) => {
            if (event.button !== 2) return;
            chart.options.animation.duration = 500;
            isYZooming = false;
        });

        // Double-click resets both x and y zoom
        ctx.addEventListener('dblclick', () => {
            chart.options.scales.x.min = undefined;
            chart.options.scales.x.max = undefined;
            chart.options.scales.y.min = undefined;
            chart.options.scales.y.max = undefined;
            chart.update();
        });

    </script>
